<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>notes.chat — Ask Your Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f1219;
    --panel: #1a1f2b;
    --accent: #00e5ff;
    --accent2: #8b6eff;
    --text: #f8f8ff;
    --text-dim: #c0c8e0;
    --border: #37405a;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  *{box-sizing:border-box;}
  
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    padding:0;
  }

  .header{
    background: rgba(26, 31, 43, 0.95);
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    align-items:center;
    justify-content:space-between;
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo{
    font-family:var(--mono);
    font-size: 24px;
    font-weight:700;
    letter-spacing: -0.5px;
    color: var(--accent);
  }
  .logo .dot{color: #00ffcc;}

  .controls{
    display:flex;
    align-items:center;
    gap:18px;
  }

  .doc-info{
    background: #22293a;
    border:1px solid var(--border);
    border-radius:12px;
    padding:9px 18px;
    font-size:13.5px;
    display:flex;
    align-items:center;
    gap:14px;
  }

  .upload-btn{
    background: linear-gradient(135deg, var(--accent), #00b8d9);
    color: #0f1219;
    border: none;
    padding: 11px 22px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
  }
  .upload-btn:hover{
    transform: translateY(-2px);
    box-shadow: 0 10px 25px -8px var(--accent);
  }

  .main-container{
    display:flex;
    flex:1;
    overflow:hidden;
  }

  .sidebar{
    width: 310px;
    background: #1a1f2b;
    border-right:1px solid var(--border);
    padding:28px 24px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  .chip{
    width:100%;
    text-align:left;
    background: #252b40;
    border:1px solid #4a5a7a;
    color: #e0e6ff;
    padding:14px 16px;
    border-radius:10px;
    margin-bottom:10px;
    cursor:pointer;
    transition:all 0.2s;
    font-size:14.2px;
  }
  .chip:hover{
    border-color: var(--accent);
    background: #2e3750;
    transform: translateX(6px);
  }

  .chat-area{
    flex:1;
    display:flex;
    flex-direction:column;
  }

  .messages{
    flex:1;
    overflow-y:auto;
    padding:32px 40px;
    display:flex;
    flex-direction:column;
    gap:26px;
  }

  .msg.user .bubble{
    background: linear-gradient(135deg, var(--accent2), #9b7dff);
    color: white;
  }
  .msg.bot .bubble{
    background: #22293a;
    border:1px solid var(--border);
  }

  .bubble{
    padding:15px 18px;
    border-radius:14px;
    font-size:15.2px;
    line-height:1.6;
  }

  .label{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-dim);
  }

  .input-area{
    padding:22px 40px 32px;
    background: #1a1f2b;
    border-top:1px solid var(--border);
  }
  .inputbar{
    display:flex;
    gap:12px;
    background: #22293a;
    border:1px solid var(--border);
    border-radius:14px;
    padding:8px;
  }
  .inputbar input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-size:15.5px;
    padding:14px 18px;
  }
  .inputbar button{
    background: linear-gradient(135deg, var(--accent), #00b8d9);
    color:#0f1219;
    border:none;
    padding:0 32px;
    border-radius:10px;
    font-weight:600;
  }

  .empty-state{
    max-width:480px;
    margin:auto;
    text-align:center;
    padding:60px 20px;
  }
  .empty-state h2{
    font-size:32px;
    margin-bottom:12px;
    background: linear-gradient(90deg, var(--accent), #8b6eff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  @media (max-width:760px){
    .sidebar{display:none;}
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span class="dot">●</span> notes.chat</div>
  
  <div class="controls">
    <div class="doc-info" id="docInfo">
      <span id="docName">No document loaded</span>
      <span id="docMeta" style="color:var(--accent); font-family:var(--mono);">—</span>
    </div>
    
    <div class="upload-area">
      <input type="file" id="pdfInput" accept="application/pdf" hidden />
      <button class="upload-btn" id="uploadBtn">Upload PDF</button>
    </div>
  </div>
</div>

<div class="main-container">
  <aside class="sidebar">
    <div style="font-family:var(--mono); font-size:13px; color:var(--text-dim); margin-bottom:10px;">Suggested Questions</div>
    <div class="suggestions" id="suggestions" style="display:none;">
      <div id="suggestionChips"></div>
    </div>
  </aside>

  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <h2>Ask Your Notes Anything</h2>
        <p style="color:var(--text-dim); font-size:15.5px; line-height:1.7;">
          Upload a PDF and chat with your own notes.<br>
          Answers are generated only from your document content.
        </p>
      </div>
    </div>

    <div class="input-area">
      <form class="inputbar" id="chatForm">
        <input type="text" id="userInput" placeholder="Type your question here..." autocomplete="off" disabled />
        <button type="submit" id="sendBtn" disabled>Send</button>
      </form>
    </div>
  </div>
</div>

<script>
// Same functional JavaScript (English)
const messagesEl = document.getElementById('messages');
const emptyState = document.getElementById('emptyState');
const form = document.getElementById('chatForm');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const pdfInput = document.getElementById('pdfInput');
const uploadBtn = document.getElementById('uploadBtn');
const docName = document.getElementById('docName');
const docMeta = document.getElementById('docMeta');
const suggestions = document.getElementById('suggestions');
const suggestionChips = document.getElementById('suggestionChips');

const OS_NOTES_CHIPS = [
  'What is a Process?',
  'What is a Microkernel system?',
  'What are the advantages of Threads?',
  'What is stored in PCB?'
];

function activateChat(filename){
  input.disabled = false;
  sendBtn.disabled = false;
  input.placeholder = 'Ask anything about your document...';
  docName.textContent = filename || 'Document Loaded';
  docMeta.textContent = 'Ready';
  
  suggestionChips.innerHTML = '';
  const chips = (filename || '').toLowerCase().includes('os_notes') ? OS_NOTES_CHIPS : 
                ['Give me a summary of this document', 'What topics are covered?'];
  
  chips.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = q;
    btn.addEventListener('click', () => sendQuery(q));
    suggestionChips.appendChild(btn);
  });
  suggestions.style.display = 'block';
}

uploadBtn.addEventListener('click', () => pdfInput.click());

pdfInput.addEventListener('change', async () => {
  const file = pdfInput.files[0];
  if (!file) return;
  
  uploadBtn.textContent = 'Processing...';
  uploadBtn.disabled = true;

  const formData = new FormData();
  formData.append('pdf', file);

  try {
    const res = await fetch('/upload', { method: 'POST', body: formData });
    const data = await res.json();
    
    if (data.error) {
      alert(data.error);
    } else {
      docName.textContent = data.filename;
      docMeta.textContent = `${data.pages} pages • ${data.chunks} chunks`;
      activateChat(data.filename);
      input.focus();
    }
  } catch (err) {
    alert('Upload failed. Please try again.');
  } finally {
    uploadBtn.textContent = 'Upload PDF';
    uploadBtn.disabled = false;
    pdfInput.value = '';
  }
});

function addMessage(text, sender){
  if(emptyState) emptyState.remove();
  const wrap = document.createElement('div');
  wrap.className = `msg ${sender}`;
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = sender === 'user' ? 'YOU' : 'NOTES AI';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTyping(){
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id = 'typingMsg';
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = 'NOTES AI';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '●●●';
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendQuery(query){
  addMessage(query, 'user');
  input.value = '';
  sendBtn.disabled = true;
  addTyping();

  try{
    const res = await fetch('/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: query})
    });
    const data = await res.json();
    document.getElementById('typingMsg')?.remove();
    addMessage(data.answer || data.error || 'No response received.', 'bot');
  } catch(err){
    document.getElementById('typingMsg')?.remove();
    addMessage('Connection error. Please check if the backend is running.', 'bot');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if(!q) return;
  sendQuery(q);
});
</script>
</body>
</html>
